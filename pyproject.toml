[project]
name = "gene-expression-lake"
version = "0.1.0"
description = "Builds the gene expression lake (G026, protein-coding genes) one dataset at a time."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "requests>=2.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gene_expression_lake"]
